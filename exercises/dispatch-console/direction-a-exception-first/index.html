<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Dispatch — Exception-First</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="../data.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <span class="mark">Meridian</span>
  <span class="topbar-meta"><span id="clock"></span> · Dispatch — Central Region</span>
</header>

<main class="board">
  <section class="attention" aria-label="Loads needing a decision">
    <h1>Needs a decision</h1>
    <div id="attention-list"></div>
  </section>

  <details class="quiet-group" open>
    <summary>On schedule <span id="ontime-count" class="count"></span></summary>
    <div id="ontime-list" class="quiet-list"></div>
  </details>

  <details class="quiet-group">
    <summary>Delivered today <span id="delivered-count" class="count"></span></summary>
    <div id="delivered-list" class="quiet-list"></div>
  </details>
</main>
</body>
</html>
