<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Dispatch — Full Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="../data.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <span class="mark">MERIDIAN</span>
  <nav class="viewtabs">
    <button class="tab active" data-sort="urgency">Urgency</button>
    <button class="tab" data-sort="window">Window</button>
    <button class="tab" data-sort="driver">Driver</button>
  </nav>
  <span class="clock" id="clock"></span>
</header>

<section class="driver-strip" id="driver-strip" aria-label="Driver roster"></section>

<main>
  <table class="board-table">
    <thead>
      <tr>
        <th>Load</th><th>Status</th><th>Route</th><th>Shipper</th><th>Driver</th><th>Truck</th><th>HOS</th><th>Window</th><th>Time left</th>
      </tr>
    </thead>
    <tbody id="board-body"></tbody>
  </table>
</main>
</body>
</html>
