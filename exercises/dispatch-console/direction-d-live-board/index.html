<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Dispatch — Live Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="../data.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <span class="mark">MERIDIAN <span class="mark-sub">LIVE</span></span>
  <span class="clock" id="clock"></span>
</header>

<section class="timeline-wrap" aria-hidden="true">
  <div class="timeline" id="timeline">
    <div class="now-line" id="now-line"><span class="now-label">NOW</span></div>
    <div class="ruler" id="ruler"></div>
    <div class="tracks" id="tracks"></div>
  </div>
</section>

<main class="list-view" aria-label="Loads by time until appointment window, in detail">
  <h1>Active loads, ordered by how soon their window closes</h1>
  <div id="list-body"></div>
</main>
</body>
</html>
